[tools]
bun = "latest"
hk = "latest"
node = "lts"
pkl = "latest"
rust = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise && pnpm install"

[settings]
node.corepack = true

[tasks.build]
description = "Build the Rust formatter"
run = "cargo build --release"

[tasks.checks]
description = "Run all checks (formatting, linting)"
depends = ["format:check", "lint", "test"]

[tasks.format]
description = "Format Rust code"
run = "cargo fmt"

[tasks."format:check"]
description = "Check Rust code formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Lint Rust code with Clippy"
run = "cargo clippy -- --deny warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks.compare]
description = "Compare Node.js and Rust formatter output on provided input files"
run = "bun tasks/compare.ts"

[tasks."docs:dev"]
description = "Start the documentation dev server (served under /ardent)"
run = "pnpm --filter web dev"

[tasks."docs:build"]
description = "Build the documentation site"
run = "pnpm --filter web build"

[tasks."docs:preview"]
description = "Preview the built documentation site"
run = "pnpm --filter web preview"

[tasks."docker:build"]
description = "Build the Docker image"
run = "docker build -t ardent ."

[tasks.ardent]
description = "Run the application"
run = "cargo run --release --bin ardent --"
